[profile.default]
src = "src"
out = "out"
libs = ["dependencies"]
solc = "0.8.28"
auto_detect_solc = false
optimizer = true
optimizer_runs = 10000
bytecode_hash = "none"
cbor_metadata = false
verbosity = 3
gas_reports = ["SendAndReceiveERC1155TL", "SendAndReceiveERC721TL", "SendAndReceiveERC1155TLRaffle", "SendAndReceiveERC721", "SendAndReceiveCurrency"]
show_progress = true
fs_permissions = [{ access = "read-write", path = "./.temp"}]

[fuzz]
runs = 1024

[dependencies]
forge-std = "1.9.7"
tl-creator-contracts = "3.7.1"
"@openzeppelin-contracts" = "5.0.2"
"@openzeppelin-contracts-upgradeable" = "5.0.2"

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
arbitrum_sepolia = "${ARB_SEPOLIA_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
shape_sepolia = "${SHAPE_SEPOLIA_RPC_URL}"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"
mainnet = "${ETH_RPC_URL}"
arbitrum = "${ARB_RPC_URL}"
base = "${BASE_RPC_URL}"
shape = "${SHAPE_RPC_URL}"
robinhood = "${ROBINHOOD_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_KEY}" }
arbitrum_sepolia = {  key = "${ETHERSCAN_KEY}" }
base_sepolia = {  key = "${ETHERSCAN_KEY}" }
mainnet = { key = "${ETHERSCAN_KEY}"}
arbitrum = { key = "${ETHERSCAN_KEY}" }
base = { key = "${ETHERSCAN_KEY}" }
